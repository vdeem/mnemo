[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemolite"
version = "0.1.0"
description = "Local-first, zero-LLM memory engine for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "vdeem"}]
keywords = ["ai", "agents", "memory", "mcp", "local-first", "sqlite", "chromadb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "chromadb>=1.5,<2",
    "sentence-transformers>=3,<7",
    "spacy>=3.7,<4",
    "mcp>=2,<3",
    "anyio>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["build>=1,<2", "twine>=5,<7", "wheel>=0.42,<1"]

[project.scripts]
mnemolite-server = "mnemolite.server:main"

[project.urls]
Homepage = "https://github.com/vdeem/mnemo"
Repository = "https://github.com/vdeem/mnemo"
Documentation = "https://github.com/vdeem/mnemo/tree/main/docs"
Issues = "https://github.com/vdeem/mnemo/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mnemolite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]